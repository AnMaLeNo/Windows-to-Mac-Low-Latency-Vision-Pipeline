; src_dir = "." so PlatformIO compiles the .ino sitting next to this file rather than
; requiring a src/ subfolder. That keeps a single copy of the source that both PlatformIO
; and the Arduino IDE can open - no duplicated file to drift out of sync.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
