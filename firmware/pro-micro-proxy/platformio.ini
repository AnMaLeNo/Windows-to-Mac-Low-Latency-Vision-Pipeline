; See the note in ../esp32-link/platformio.ini about src_dir.
;
; board = micro, not sparkfun_promicro16: this board enumerates as USB VID 2341 / PID 8037,
; which is a genuine Arduino Micro identity, not SparkFun's 1B4F. The board choice sets the
; VID/PID compiled into the HID descriptor and the magic PID the uploader looks for after
; the 1200-baud touch reset, so getting it wrong breaks the upload handshake.
[platformio]
src_dir = .

[env:micro]
platform = atmelavr
board = micro
framework = arduino
; No lib_deps, unlike ../pro-micro-hid. This sketch forwards complete HID reports
; rather than pressing named keys, so it needs only HID.h - which the AVR core does
; bundle - and never Keyboard.h with its ASCII-to-keycode mapping.
