; See the note in ../esp32-link/platformio.ini about src_dir.
;
; board = micro, not sparkfun_promicro16: it sets the MCU, the 16MHz clock and the
; avr109 upload protocol. It no longer decides what the *running* sketch looks like on
; USB - usb_identity.h overrides the whole device descriptor, VID and PID included.
;
; The bootloader has its own identity, unaffected by any of this. Measured on the board
; in use here it announces 2341:0036 "Arduino Leonardo", not the 2341:0037 a real Micro
; would use - clone Pro Micros are usually flashed with the Leonardo bootloader. Only
; matters when you go looking for the port to upload to.
[platformio]
src_dir = .

[env:micro]
platform = atmelavr
board = micro
framework = arduino

; CDC_DISABLED drops the USB serial port, which is what moves the keyboard onto USB
; interface 0 and lets Windows call it MI_00. usb_identity.h explains the whole chain.
; This sketch never used USB Serial anyway - the Pi link is Serial1, a real UART.
;
; *** IT DOES CHANGE HOW YOU FLASH THIS BOARD. *** Without CDC there is no serial port
; for the 1200-baud touch that normally kicks the board into its bootloader, so the
; upload has to be started by hand:
;
;   1. short RST to GND twice quickly (Pro Micros have the pads, not a button)
;   2. the bootloader enumerates as /dev/ttyACM0 and stays there for ~8 seconds
;   3. within that window: pio run -t upload --upload-port /dev/ttyACM0
;
; Naming the port matters: with no sketch port to fall back on, autodetection has
; nothing to find until the bootloader is already up.
;
; ../../tools/flash_pro_micro.sh does all three from the Mac, and does the slow parts
; before the reset so the 8 seconds are spent on avrdude alone. Use it rather than
; racing the window by hand.
;
; Delete this flag and uploads go back to being automatic - at the price of the
; keyboard landing on interface 2 again, i.e. MI_02 instead of MI_00.
build_flags = -DCDC_DISABLED

; No lib_deps, unlike ../pro-micro-hid. This sketch forwards complete HID reports
; rather than pressing named keys, so it needs only HID.h - which the AVR core does
; bundle - and never Keyboard.h with its ASCII-to-keycode mapping.
